# Diagnostic-only branch; these results do not replace PR checks.
name: test-quality two-shard diagnostics

on:
  push:
    branches:
      - mdangelo/codex/pr939-part04-two-shard-check

permissions:
  contents: read

concurrency:
  group: test-quality-two-shard-diagnostics-${{ github.ref }}
  cancel-in-progress: true

env:
  CODEX_SECURITY_INTEGRATION: "0"
  CODEX_SECURITY_ALLOW_MACHINE_POLICY_TEST: "false"

jobs:
  native:
    uses: ./.github/workflows/native-artifacts.yml

  runner:
    needs: native
    if: ${{ !cancelled() && needs.native.result == 'success' }}
    name: ${{ matrix.os }} / ${{ matrix.mode }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && (matrix.mode == 'baseline' && 60 || matrix.mode == 'parallel' && 45) || 30 }}
    env:
      CODEX_SECURITY_PROPERTY_SEED: "48"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            mode: baseline
            args: ""
          - os: ubuntu-latest
            mode: parallel-1
            args: --isolate --shard=1/2
          - os: ubuntu-latest
            mode: parallel-2
            args: --isolate --shard=2/2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Set up Python
        if: runner.os == 'Windows'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Prepare native runtime
        uses: ./.github/actions/download-native
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.13.0"
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
          cache: true
          cache_dependency_path: |
            sdk/typescript/pnpm-lock.yaml
            plugins/codex-security/mcp-app/pnpm-lock.yaml
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - name: Install dependencies
        run: |
          pnpm --dir sdk/typescript install --frozen-lockfile
          pnpm --dir plugins/codex-security/mcp-app install --frozen-lockfile
      - name: Prepare private Windows test root
        if: runner.os == 'Windows'
        id: windows-temp
        shell: pwsh
        run: ./sdk/typescript/scripts/prepare-windows-test-root.ps1
      - name: Test runner mode
        shell: bash
        env:
          CODEX_SECURITY_TEST_TIMEOUT_MS: ${{ runner.os == 'Windows' && '120000' || '30000' }}
          TEMP: ${{ steps.windows-temp.outputs.path || runner.temp }}
          TMP: ${{ steps.windows-temp.outputs.path || runner.temp }}
          TMPDIR: ${{ steps.windows-temp.outputs.path || runner.temp }}
        run: |
          node -e "require('node:fs').mkdirSync('sdk/typescript/reports',{recursive:true})"
          pnpm --dir sdk/typescript run test ${{ runner.os == 'Windows' && '--timeout=120000' || '' }} ${{ matrix.args }} --seed=${{ env.CODEX_SECURITY_PROPERTY_SEED }} --reporter=junit --reporter-outfile=reports/runner-${{ matrix.os }}-${{ matrix.mode }}.xml
      - name: Upload runner report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runner-${{ matrix.os }}-${{ matrix.mode }}
          overwrite: true
          path: sdk/typescript/reports/runner-*.xml
          if-no-files-found: error
          retention-days: 14

  compare:
    name: Runner inventory and timing
    if: always() && !cancelled()
    needs: [runner]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.13.0"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
          cache: true
          cache_dependency_path: sdk/typescript/pnpm-lock.yaml
      - name: Install comparison dependencies
        run: pnpm --dir sdk/typescript install --frozen-lockfile
      - name: Compile CI scripts
        run: pnpm --dir sdk/typescript run build:ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: runner-*
          merge-multiple: true
          path: reports
      - name: Compare inventories and outcomes
        shell: bash
        run: |
          node sdk/typescript/scripts/compare-test-reports.mjs reports/runner-ubuntu-latest-baseline.xml 'reports/runner-ubuntu-latest-parallel*.xml' >> "$GITHUB_STEP_SUMMARY"
