<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Codex Security · Local</title>
  </head>
  <body>
    <header>
      <strong>Codex Security</strong><span>Local</span>
      <nav aria-label="Security">
        <button data-view="scans" aria-pressed="true">Scans</button
        ><button data-view="findings" aria-pressed="false">Findings</button>
      </nav>
      <button id="new-scan" disabled>New scan</button>
    </header>
    <form id="search-form">
      <label for="search">Search local results</label
      ><input id="search" type="search" /><button>Search</button
      ><button id="refresh" type="button" disabled>Refresh</button>
    </form>
    <p class="scope-note">
      Results on the selected computer · Actions open a Codex conversation
    </p>
    <p id="notice" role="status" aria-live="polite"></p>
    <div id="actions"></div>
    <main><p>Connecting to Codex…</p></main>
  </body>
</html>
